[package]
name = "tetra-tn-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native Rust + Slint TETRA TN UI, a variant serving the server side of the BlueStation MS external interface"
license = "MIT"

[dependencies]
slint = "1.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.30.0"
crossbeam-channel = "0.5.16"
serde_json = "1.0.151"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.23.0"
cpal = "0.15"
libloading = "0.8"

[build-dependencies]
slint-build = "1.17"
