[package]
name = "tetra-bluestation-mmi"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native Rust + Slint MMI (man-machine interface) serving the server side of the tetra-bluestation MS external interface"
license = "MIT"

[dependencies]
slint = "1.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.30.0"
crossbeam-channel = "0.5.16"
serde_json = "1.0.151"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.23.0"
cpal = "0.15"
# Bundled pure-Rust ACELP speech codec (git submodule). The ETSI reference
# data tables are generated once via the submodule's `populate` tool (see
# README); they are never committed.
tetra-acelp = { path = "third_party/libtetra-acelp" }

[build-dependencies]
slint-build = "1.17"

# The pure-Rust ACELP codec relies on wrapping fixed-point arithmetic; disable
# overflow checks for it in dev builds (release already has them off) so decode/
# encode don't panic on intentional integer wraparound.
[profile.dev.package.tetra-acelp]
overflow-checks = false
