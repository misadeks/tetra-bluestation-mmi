# TETRA TN UI configuration.
#
# This app is the SERVER side of the BlueStation MS external interface: the
# stack (or fake_stack.py) is the WebSocket client and dials OUT to the host and
# ports below. Networking is wired up in M2; M1 only parses this file.

[command]     # control channel (subprotocol bluestation-control-v1)
host = "0.0.0.0"
port = 9102
use_tls = false
# ca_cert = "certs/server.pem"
username = ""   # empty = accept all (demo)
password = ""

[telemetry]   # telemetry channel (subprotocol bluestation-telemetry-v1)
host = "0.0.0.0"
port = 9101
use_tls = false
username = ""
password = ""

[registration]  # operator preference, NOT identity
registration_type = "RegistrationToIndicatedCell"   # or "PeriodicRegistration"

[log]           # diagnostics: raw WebSocket frame logging
ws        = false        # log every control + telemetry frame to ws_path
ws_path   = "ws.log"
ws_speech = false        # include high-rate MsSpeechFrame voice frames (noisy)

[audio]
enabled       = true          # two-way voice (ACELP decode/encode)
# Directory holding the prebuilt ACELP codec libraries (ETSI-copyrighted, never
# committed). Windows: tetra_acelp.dll + tetra_acelp_enc.dll; Linux (Pi):
# libtetra_acelp.so + libtetra_acelp_enc.so. Must match the running arch.
codec_dir     = 'native'
output_device = "default"
input_device  = "default"
sample_rate   = 8000
frame_ms      = 60
jitter_ms     = 180           # downlink cushion (ms) for bursty delivery; 0 = off

[ui]
# Select a device model from the catalog below (or the built-in models:
# "pi-1280x720", "pi-720x1280", "linht"). Explicit width/height/scale/input
# below override the selected model.
model  = "pi-720x1280"
# width  = 720          # device pixels, overrides the model
# height = 1280         # device pixels, overrides the model
# scale forces the UI scale factor and, in dev, overrides the host display
# scaling (e.g. Windows 150%) so the window renders at the target 1:1.
scale  = 1.0
# input selects the layout and interaction model: "touch" or "keypad".
# input  = "touch"      # overrides the model's input kind
# show_event_log controls whether the Event Log entry appears in the Menu.
show_event_log = true
theme  = "classic"

# Device model catalog. Add your own panels here and select one via [ui].model.
# A profile defined here overrides a built-in of the same name. These example
# resolutions should be confirmed against the real hardware.
[[device]]
name   = "pi-720x1280"   # portrait Pi touchscreen
width  = 720
height = 1280
scale  = 1.0
input  = "touch"

[[device]]
name   = "pi-1280x720"   # landscape Pi touchscreen
width  = 1280
height = 720
scale  = 1.0
input  = "touch"

[[device]]
name   = "linht"         # LinHT-style keypad handheld (example, adjust to hardware)
width  = 480
height = 800
scale  = 1.0
input  = "keypad"

