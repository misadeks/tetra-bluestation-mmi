# TETRA BlueStation MMI configuration.
#
# This app is the SERVER side of the BlueStation MS external interface: the
# stack (or a simulator) is the WebSocket client and dials OUT to the host and
# ports below.

[command]     # control channel (subprotocol bluestation-control-v1)
host = "0.0.0.0"
port = 9102
use_tls = false
# ca_cert = "certs/server.pem"
username = ""   # empty = accept all (demo)
password = ""

[telemetry]   # telemetry channel (subprotocol bluestation-telemetry-v1)
host = "0.0.0.0"
port = 9101
use_tls = false
username = ""
password = ""

[registration]  # operator preference, NOT identity
registration_type = "RegistrationToIndicatedCell"   # or "PeriodicRegistration"

[log]           # diagnostics: raw WebSocket frame logging
ws        = false        # log every control + telemetry frame to ws_path
ws_path   = "ws.log"
ws_speech = false        # include high-rate MsSpeechFrame voice frames (noisy)

[audio]
enabled       = true          # two-way voice (ACELP decode/encode via bundled tetra-acelp)
# Audio output/input device (ringtones + two-way voice). A case-insensitive
# substring of the cpal device name; "default" uses the ALSA default. On the Pi,
# install deploy/asound.conf (routes "default" to the USB codec, full duplex) and
# keep these "default" so the UI's audio stays off the SX1255 SDR's I2S DMA.
# List names with `./tetra-bluestation-mmi --list-audio`. On other hosts (e.g.
# Windows dev) "default" is simply the system default.
output_device = "default"
input_device  = "default"
sample_rate   = 8000
frame_ms      = 60
jitter_ms     = 0             # downlink cushion (ms) for bursty delivery; 0 = off

[ui]
# Select a device model from the catalog below (or the built-in models:
# "pi-1280x720", "pi-720x1280", "linht"). Explicit width/height/scale/input/
# rotation below override the selected model.
model  = "pi-1280x720"
# width  = 720          # device pixels, overrides the model
# height = 1280         # device pixels, overrides the model
# scale forces the UI scale factor and, in dev, overrides the host display
# scaling (e.g. Windows 150%) so the window renders at the target 1:1.
scale  = 1.0
# input selects the layout and interaction model: "touch" or "keypad".
# input  = "touch"      # overrides the model's input kind
# rotation (0/90/180/270) rotates the rendered output on the Pi (linuxkms) so a
# landscape model shows correctly on a native-portrait panel. Flip 90<->270 if
# the image is upside down for your mount. Ignored on desktop. Touch needs a
# matching libinput calibration matrix - see PI_SETUP.md.
# rotation = 90         # overrides the model's rotation
# theme: "classic" (dark, default) or "light" for the light colour scheme.
theme  = "classic"

# Device model catalog. Add your own panels here and select one via [ui].model.
# A profile defined here overrides a built-in of the same name. These example
# resolutions should be confirmed against the real hardware.
[[device]]
name   = "pi-720x1280"   # portrait Pi touchscreen
width  = 720
height = 1280
scale  = 1.0
input  = "touch"
rotation = 0

[[device]]
name   = "pi-1280x720"   # landscape UI on the native-portrait DSI panel
width  = 1280
height = 720
scale  = 1.0
input  = "touch"
rotation = 90            # quarter-turn onto the 720x1280 panel (use 270 to flip)

[[device]]
name   = "linht"         # LinHT-style keypad handheld (example, adjust to hardware)
width  = 480
height = 800
scale  = 1.0
input  = "keypad"

