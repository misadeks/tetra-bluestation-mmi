# TETRA BlueStation MMI - route ALSA "default" to the USB audio codec (full duplex).
#
# The UI's audio (ringtones + two-way ACELP voice) must NOT use the Pi's onboard
# audio DMA, which contends with the SX1255 SDR's I2S and blocks registration.
# This points the ALSA "default" device at the USB PnP codec (card name
# "Device") for both playback and capture, via dmix/dsnoop so multiple clients
# can share it (the voice engine holds an output+capture stream while the
# ringtone opens its own output). The SX1255 SDR uses its own card directly and
# is unaffected.
#
# Install on the Pi:
#   sudo cp deploy/asound.conf /etc/asound.conf
# then set [audio].output_device / input_device = "default" in config.toml.
# If your USB codec enumerates under a different card name, change "Device"
# (see `aplay -l` / `arecord -l`, or `./tetra-bluestation-mmi --list-audio`).

pcm.!default {
    type asym
    playback.pcm "dmix:CARD=Device,DEV=0"
    capture.pcm  "dsnoop:CARD=Device,DEV=0"
}
ctl.!default {
    type hw
    card Device
}
